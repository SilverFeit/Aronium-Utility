  <text x="48" y="152" fill="#38bdf8" font-family="sans-serif" font-weight="600" font-size="20">Sincronizador de Fiados por Cliente, Inventario Vivo, Google Drive Web OAuth, Multi-Caja &amp; DIAN</text>

  <text x="48" y="194" fill="#cbd5e1" font-family="sans-serif" font-size="15">• Lee pos.db en modo estricto solo lectura (mode=ro) sin bloquear la caja registradora de Aronium Lite</text>
  <text x="48" y="222" fill="#cbd5e1" font-family="sans-serif" font-size="15">• Enruta cada venta a crédito ("Fiado") con nombre de cliente directamente a su cuenta en Google Drive / Sheets</text>
  <text x="48" y="250" fill="#cbd5e1" font-family="sans-serif" font-size="15">• Incluye Instalador Nativo para Windows (aronium-util-setup.exe) que configura el CLI y variables de entorno</text>
  <text x="48" y="278" fill="#cbd5e1" font-family="sans-serif" font-size="15">• Respaldos en caliente (AES-256-GCM), Hub Multi-Estación Offline-First y Conector Fiscal DIAN UBL 2.1</text>

